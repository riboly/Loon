<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Komari probe logo">
  <defs>
    <radialGradient id="glass" cx="36%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#eef4f1"/>
      <stop offset="45%" stop-color="#c3cfca"/>
      <stop offset="80%" stop-color="#93a89b"/>
      <stop offset="100%" stop-color="#7fa68d"/>
    </radialGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="45%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#a8ff5e"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9a6"/>
      <stop offset="55%" stop-color="#00f26e"/>
      <stop offset="100%" stop-color="#c6ff7a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="210"/>
    </clipPath>
  </defs>
  <!-- Outside the circle there is nothing: fully transparent -->
  <circle cx="256" cy="256" r="210" fill="url(#glass)"/>
  <g clip-path="url(#circleClip)" filter="url(#glow)">
    <!-- Three signal waves, top to bottom -->
    <path d="M 82 218 C 175 172, 262 128, 352 164 C 392 180, 422 212, 442 254 C 382 204, 300 194, 230 226 C 168 252, 118 246, 82 218 Z" fill="url(#wave)"/>
    <path d="M 82 296 C 178 250, 268 208, 360 234 C 400 246, 430 274, 446 310 C 382 264, 300 258, 230 290 C 168 316, 118 316, 82 296 Z" fill="url(#wave2)"/>
    <path d="M 102 366 C 190 324, 282 284, 366 304 C 406 313, 436 334, 452 360 C 390 334, 310 340, 240 366 C 180 389, 134 386, 102 366 Z" fill="url(#wave)"/>
    <!-- Light top edges on the waves -->
    <path d="M 100 212 C 190 168, 272 130, 352 164" fill="none" stroke="#eafff5" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
    <path d="M 100 290 C 190 248, 272 212, 360 234" fill="none" stroke="#eafff5" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
    <path d="M 120 360 C 205 320, 288 288, 366 304" fill="none" stroke="#eafff5" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Soft glass highlight, also clipped by the circle edge visually -->
  <g clip-path="url(#circleClip)">
    <ellipse cx="188" cy="148" rx="118" ry="58" fill="#ffffff" opacity="0.16" transform="rotate(-18 188 148)"/>
  </g>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#b9f6ca" stroke-width="4" opacity="0.85"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
</svg>
